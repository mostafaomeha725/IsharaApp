name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Patch flutter_vision podspec to add TensorFlowLite dependency
        run: |
          PODSPEC=$(find $HOME/.pub-cache -name "flutter_vision.podspec" 2>/dev/null | head -1)
          if [ -n "$PODSPEC" ]; then
            echo "Found podspec at: $PODSPEC"
            sed -i '' "s/s.dependency 'Flutter'/s.dependency 'Flutter'\n  s.dependency 'TensorFlowLiteSwift', '~> 2.14.0'/" "$PODSPEC"
            sed -i '' "s/s.platform = :ios, '9.0'/s.platform = :ios, '14.0'/" "$PODSPEC"
            echo "Patched podspec:"
            cat "$PODSPEC"
          else
            echo "Warning: flutter_vision.podspec not found in pub cache"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload
          zip -r app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa
